<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BOWMAN.EXE — a retro WebGPU portfolio operating system">
<title>BOWMAN.EXE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23008080'/%3E%3Crect x='2' y='3' width='12' height='8' fill='%23c0c0c0'/%3E%3Crect x='3' y='4' width='10' height='6' fill='%23000080'/%3E%3Crect x='5' y='12' width='6' height='2' fill='%23808080'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/luna.css" id="theme-css">
<link rel="stylesheet" href="css/boot.css">
<link rel="stylesheet" href="css/desktop.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- ============ BIOS BOOT SCREEN ============ -->
<div id="boot" role="status" aria-label="System starting">
  <div class="crt-scanlines" aria-hidden="true"></div>
  <div class="crt-vignette" aria-hidden="true"></div>

  <div class="bios-inner">
    <header class="bios-header">
      <div class="bios-header-text bios-fade" style="--d:.15s">
        <pre>BOWMAN MEGATRENDS, INC.
BOWMAN BIOS (C) 2001-2026, v5.1 PnP
WEBGPU VISITOR ACCELERATOR DETECTED</pre>
      </div>

      <!-- Energy Star badge (original simplified artwork) -->
      <div class="energy-star bios-fade" style="--d:.9s" aria-hidden="true">
        <svg viewBox="0 0 120 78" width="120" height="78" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="118" height="76" rx="10" fill="#10246e" stroke="#9fb6ff" stroke-width="2"/>
          <text x="12" y="34" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
                font-size="26" fill="#ffffff">energy</text>
          <path d="M14 46 q 46 26 92 -6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
          <path d="M97 22 l3.2 6.6 7.3 1 -5.3 5.1 1.3 7.2 -6.5 -3.4 -6.5 3.4 1.3 -7.2 -5.3 -5.1 7.3 -1 z" fill="#ffffff"/>
          <text x="14" y="68" font-family="Arial, sans-serif" font-size="9" letter-spacing="2" fill="#ffffff">ENERGY STAR</text>
        </svg>
      </div>
    </header>

    <div id="bios-lines"></div>

    <div class="bios-footer bios-fade" style="--d:4.2s">
      <pre>Press DEL to enter SETUP, ESC to skip memory test
06/10/2026-BOWMAN-2A69KR1IC-00</pre>
      <div id="bios-prompt" class="blink" hidden>Press any key (or tap) to boot BOWMAN OS . . . _</div>
    </div>
  </div>
</div>

<!-- ============ DESKTOP ============ -->
<div id="os" hidden>
  <div id="desktop" aria-label="Desktop">
    <div id="icons"></div>
    <div id="windows"></div>
  </div>

  <div id="ctx-menu" class="menu" hidden role="menu"></div>
  <div id="start-menu" class="menu start" hidden role="menu"></div>

  <nav id="taskbar" aria-label="Taskbar">
    <button id="start-btn" class="btn start-btn" aria-haspopup="menu">
      <span class="start-logo" aria-hidden="true"></span><span>Start</span>
    </button>
    <div class="task-sep" aria-hidden="true"></div>
    <div id="task-buttons"></div>
    <div id="tray">
      <button id="tray-music" class="tray-btn" title="Lo-fi beat (M)">♫</button>
      <button id="tray-sound" class="tray-btn" title="Mute (B)">🔊</button>
      <span id="tray-clock">--:--</span>
    </div>
  </nav>
</div>

<div id="toast" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
